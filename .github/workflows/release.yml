name: CyanDeck signed Stable release
on:
  push:
    branches: [main]
    paths: ['.github/stable-release-request.txt', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      promote: ${{ steps.gate.outputs.promote }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import xml.etree.ElementTree as e;print(e.parse('src/CyanDeck/CyanDeck.csproj').findtext('.//Version'))")"
          request="$(tr -d '[:space:]' < .github/stable-release-request.txt)"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "promote=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Workflow file edits during Beta development are NOT Stable requests.
          # Do not fail CI or accidentally publish when the gate is unchanged.
          if [ "$request" != "$version" ]; then
            echo "No explicit Stable release requested for v$version. Skipping."
            exit 0
          fi
          python3 - "$version" "$request" <<'PY'
          import sys
          version, request = sys.argv[1:]
          values = version.split('.')
          if len(values) != 3 or any(not part.isdigit() for part in values):
              raise SystemExit('Stable version must have three numeric components.')
          if version != request or tuple(map(int, values)) <= (8, 0, 9):
              raise SystemExit('Explicit Stable request must equal project version and exceed v8.0.9.')
          PY
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Promotion is metadata-only. Reuse the exact signed Beta artifacts;
            # never overwrite files that existing users may already have installed.
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            if echo "$release" | jq -e '.draft == false and .prerelease == false and (.assets | length) == 8' >/dev/null; then
              actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
              if [ "$actual" != "$tag" ]; then
                echo "::error::Release $tag exists but is not the latest Stable ($actual)."
                exit 1
              fi
              echo "Already published and verified Stable: $tag. No assets changed."
              exit 0
            fi
            if echo "$release" | jq -e '.draft == false and .prerelease == true and (.assets | length) == 8' >/dev/null; then
              echo "promote=true" >> "$GITHUB_OUTPUT"
              echo "Promoting existing signed Beta $tag to Stable without rebuilding."
              exit 0
            fi
            echo "::error::Existing $tag is neither a verified Stable nor a complete published Beta."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
  promote:
    needs: prepare
    if: needs.prepare.outputs.promote == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote signed Beta to default Stable without replacing assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_path="$RUNNER_TEMP/cyandeck-release-before.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_path"
          jq -e --arg version "$VERSION" '
            .tag_name == ("v" + $version) and .draft == false and .prerelease == true and
            (.assets | length) == 8 and
            ([.assets[].name] | sort) == ([
              "CyanDeck-" + $version + "-win-x64.zip",
              "CyanDeck-" + $version + "-win-arm64.zip",
              "CyanDeck-" + $version + "-win-x64.update.json",
              "CyanDeck-" + $version + "-win-arm64.update.json",
              "CyanDeck.exe", "CyanDeck-ARM64.exe",
              "CyanDeck-v" + $version + "-full-source.zip",
              "SHA256SUMS.txt"
            ] | sort) and
            ([.assets[] | (.size > 0 and (.digest // "" | test("^sha256:[0-9a-f]{64}$")))] | all)
          ' "$release_path"
          # The source tag is the exact code built for the signed Beta.
          # The current Stable-request commit may only add workflow/metadata.
          tag_commit="$(git rev-parse "$tag^{commit}")"
          release_commit="$(jq -r '.target_commitish' "$release_path")"
          test "$tag_commit" = "$release_commit"
          git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"
          asset_snapshot="$(jq -cS '[.assets[] | {name, size, digest}] | sort_by(.name)' "$release_path")"
          prior_notes="$(jq -r '.body // ""' "$release_path")"
          stable_notes="CyanDeck v$VERSION Stable promotes the previously published signed Beta to the default production update channel. The original x64/ARM64 ZIPs, EXEs, signed update manifests, full source and checksums are preserved byte-for-byte; no user settings or data are modified.

          Original release notes:
          $prior_notes"
          release_id="$(jq -r '.id' "$release_path")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F prerelease=false -f make_latest=true \
            -f name="CyanDeck $tag (Stable)" -f body="$stable_notes" >/dev/null
          updated_path="$RUNNER_TEMP/cyandeck-release-after.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$updated_path"
          jq -e '.draft == false and .prerelease == false and (.assets | length) == 8' "$updated_path"
          test "$asset_snapshot" = "$(jq -cS '[.assets[] | {name, size, digest}] | sort_by(.name)' "$updated_path")"
          # GitHub can take a moment to refresh its latest-Stable endpoint.
          latest=""
          for attempt in 1 2 3 4 5 6; do
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
            if [ "$latest" = "$tag" ]; then break; fi
            sleep 2
          done
          test "$latest" = "$tag"
          echo "Verified $tag as latest Stable; all eight signed assets unchanged."

  sign:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      CYANDECK_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CYANDECK_UPDATE_SIGNING_KEY_PEM || secrets.DESKTOPDECK_UPDATE_SIGNING_KEY_PEM }}
      CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON || secrets.DESKTOPDECK_GOOGLE_DESKTOP_OAUTH_JSON }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stable identity and safety regressions
        shell: pwsh
        run: |
          if (-not $env:CYANDECK_UPDATE_SIGNING_KEY_PEM -or -not $env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON) {
            throw 'Missing signed-update private key or Desktop OAuth client JSON.'
          }
          $oauth=$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
          if (-not $oauth.installed.client_id -or -not $oauth.installed.client_secret) {
            throw 'Invalid Desktop OAuth client JSON.'
          }
          python tools/run_v43_safety_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Safety regressions failed.' }
          python tools/test_v45_recycle_bin_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Recycle regressions failed.' }
          python tools/test_cyandeck_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'CyanDeck identity regressions failed.' }
          foreach ($name in @('CalendarDomainHarness','FenceVisibilityHarness','WatcherLifetimeHarness','CompleteResetHarness')) {
            dotnet run --project "tests/$name/$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Domain tests failed: $name" }
          }
      - name: Build, sign and verify Stable ZIP and standalone EXE
        shell: pwsh
        run: |
          $key=Join-Path $env:RUNNER_TEMP ('stable-sign-'+[Guid]::NewGuid().ToString('N')+'.pem')
          $oauthPath='json/client_secret.json'
          try {
            [IO.File]::WriteAllText($key,$env:CYANDECK_UPDATE_SIGNING_KEY_PEM,[Text.UTF8Encoding]::new($false))
            New-Item -ItemType Directory json -Force | Out-Null
            [IO.File]::WriteAllText($oauthPath,$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON,[Text.UTF8Encoding]::new($false))
            ./package.ps1 -Runtime '${{ matrix.runtime }}' -SigningKeyPath $key
            if (-not $?) { throw 'Production package creation failed.' }
            ./verify-release.ps1 -ManifestPath "dist/CyanDeck-${{ needs.prepare.outputs.version }}-${{ matrix.runtime }}.update.json"
            if (-not $?) { throw 'Signed update manifest verification failed.' }
            ./tools/test_cyandeck_release_package.ps1 -Runtime '${{ matrix.runtime }}' -RequireOAuth
            if (-not $?) { throw 'Real signed package smoke test failed.' }
            $standalone=if ('${{ matrix.runtime }}' -eq 'win-x64') { 'CyanDeck.exe' } else { 'CyanDeck-ARM64.exe' }
            if (-not (Test-Path -LiteralPath "dist/$standalone" -PathType Leaf)) {
              throw 'Standalone EXE is missing from signed Stable package.'
            }
          } finally {
            if (Test-Path -LiteralPath $oauthPath) { Remove-Item -LiteralPath $oauthPath -Force }
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-stable-${{ matrix.runtime }}
          path: |
            dist/CyanDeck-*.zip
            dist/CyanDeck-*.update.json
            dist/CyanDeck*.exe
          if-no-files-found: error
  publish:
    needs: [prepare, sign]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-stable-*
          path: release-assets
          merge-multiple: true
      - name: Publish public Stable release with verified assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 2
          test "$(find release-assets -name '*.update.json' | wc -l)" -eq 2
          test "$(find release-assets -name '*.exe' | wc -l)" -eq 2
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing public release $tag"; exit 1
          fi
          git archive --format=zip --output "release-assets/CyanDeck-$tag-full-source.zip" "$GITHUB_SHA"
          (cd release-assets && sha256sum -- *.zip *.exe > SHA256SUMS.txt)
          gh release create "$tag" --latest --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "CyanDeck $tag (Stable)" \
            --notes "CyanDeck v$VERSION Stable promotes the v8.0.33 Beta codebase to the default production update channel after x64 and ARM64 build, safety, install/uninstall and signed update-package checks. Highlights since v8.0.10: more clearly organized Settings categories (General, Behavior, Appearance, Animation, Performance and Layout/Backup), group editor under Appearance, right-click per-calendar-event background and font colors with local-only persistence, clearer blank-date gesture help, update failure diagnostics and automatic retry safeguards, and a fast Windows logoff/shutdown path that avoids heavy exit-time filesystem and Explorer cleanup. Ordinary user-initiated Exit retains its durable final save; pending changes at Windows session end retain recovery data. Existing desktop originals, group layouts, local events and Google OAuth data are preserved across normal upgrades. Windows 10/11 x64 and ARM64 standalone EXE builds include the embedded OAuth Desktop client and RSA-PSS signed update trust key, plus signed update ZIP/manifest and full source. Update signing does not imply Microsoft Authenticode signing. Actual hardware shutdown/restart behavior still requires user confirmation." \
            release-assets/*.zip release-assets/*.exe release-assets/*.update.json release-assets/SHA256SUMS.txt
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')" = true
          # gh release view --json does NOT support isLatest. Use GitHub's
          # documented releases/latest API; it excludes prereleases.
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$tag"
