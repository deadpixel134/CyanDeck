name: CyanDeck signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  sign:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      CYANDECK_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CYANDECK_UPDATE_SIGNING_KEY_PEM || secrets.DESKTOPDECK_UPDATE_SIGNING_KEY_PEM }}
      CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON || secrets.DESKTOPDECK_GOOGLE_DESKTOP_OAUTH_JSON }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release identity and credentials
        shell: pwsh
        run: |
          if (-not $env:CYANDECK_UPDATE_SIGNING_KEY_PEM -or -not $env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON) { throw 'Missing signing key or Desktop OAuth JSON.' }
          [xml]$p=Get-Content src/CyanDeck/CyanDeck.csproj -Raw
          if ('${{ github.ref_name }}' -cne ('v'+[string]$p.Project.PropertyGroup.Version)) { throw 'Release tag must match CyanDeck version.' }
          try {
            $oauth=$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
            if (-not $oauth.installed.client_id -or -not $oauth.installed.client_secret) { throw 'Invalid Desktop OAuth JSON.' }
          } catch { throw 'Invalid Google Desktop OAuth JSON.' }
      - name: Safety and calendar tests
        shell: pwsh
        run: |
          python tools/run_v43_safety_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Safety regression failed.' }
          python tools/test_v45_recycle_bin_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Recycle regression failed.' }
          dotnet run --project tests/CalendarDomainHarness/CalendarDomainHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Calendar regression failed.' }
      - name: Sign and independently verify CyanDeck package
        shell: pwsh
        run: |
          $privateKey=Join-Path $env:RUNNER_TEMP ('cyandeck-sign-'+[Guid]::NewGuid().ToString('N')+'.pem')
          $desktopOAuth='json/client_secret.json'
          try {
            [IO.File]::WriteAllText($privateKey,$env:CYANDECK_UPDATE_SIGNING_KEY_PEM,[Text.UTF8Encoding]::new($false))
            New-Item -ItemType Directory -Path json -Force | Out-Null
            [IO.File]::WriteAllText($desktopOAuth,$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON,[Text.UTF8Encoding]::new($false))
            ./package.ps1 -Runtime '${{ matrix.runtime }}' -SigningKeyPath $privateKey
            $version=([xml](Get-Content src/CyanDeck/CyanDeck.csproj -Raw)).Project.PropertyGroup.Version
            ./verify-release.ps1 -ManifestPath "dist/CyanDeck-$version-${{ matrix.runtime }}.update.json"
          } finally {
            if (Test-Path $desktopOAuth) { Remove-Item -LiteralPath $desktopOAuth -Force }
            if (Test-Path $privateKey) { Remove-Item -LiteralPath $privateKey -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.runtime }}
          path: |
            dist/CyanDeck-*.zip
            dist/CyanDeck-*.update.json
          if-no-files-found: error
  publish:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-assets
          merge-multiple: true
      - name: Archive source and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git archive --format=zip --output "release-assets/CyanDeck-${TAG}-full-source.zip" HEAD
          (cd release-assets && sha256sum -- *.zip > SHA256SUMS.txt)
      - name: Publish signed CyanDeck release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find release-assets -name '*.update.json' | wc -l)" -eq 2
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 3
          gh release create "$TAG" release-assets/*.zip release-assets/*.update.json release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "CyanDeck $TAG" --notes "Signed CyanDeck Windows packages for x64 and ARM64."
