name: One-time CyanDeck direct rename
on:
  push:
    branches: [main]
    paths: ['tools/one-shot-cyandeck-rebrand.py']
permissions:
  contents: write
jobs:
  rename:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Direct source rename without legacy data migration
        shell: pwsh
        run: python tools/one-shot-cyandeck-rebrand.py
      - name: Commit new standalone product identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git status --porcelain)) { throw 'No changes found.' }
          git commit -m "refactor: replace DesktopDeck source with standalone CyanDeck"
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
