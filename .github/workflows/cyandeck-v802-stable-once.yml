name: CyanDeck v8.0.2 stable publication (one time)
on:
  push:
    branches: [main]
    paths: ['tools/v802-stable-release.trigger']
permissions:
  contents: write
jobs:
  sign:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      CYANDECK_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CYANDECK_UPDATE_SIGNING_KEY_PEM || secrets.DESKTOPDECK_UPDATE_SIGNING_KEY_PEM }}
      CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON || secrets.DESKTOPDECK_GOOGLE_DESKTOP_OAUTH_JSON }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved stable version and secrets
        shell: pwsh
        run: |
          [xml]$project=Get-Content src/CyanDeck/CyanDeck.csproj -Raw
          if ([string]$project.Project.PropertyGroup.Version -cne '8.0.2') { throw 'Expected approved stable CyanDeck 8.0.2' }
          if (-not $env:CYANDECK_UPDATE_SIGNING_KEY_PEM -or -not $env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON) { throw 'Production signing and OAuth secrets required' }
          $oauth=$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
          if (-not $oauth.installed.client_id -or -not $oauth.installed.client_secret) { throw 'Invalid Google Desktop OAuth JSON' }
      - name: Run safety regression and domain tests
        shell: pwsh
        run: |
          python tools/run_v43_safety_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Safety tests failed' }
          python tools/test_v45_recycle_bin_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Recycle tests failed' }
          python tools/test_cyandeck_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Identity tests failed' }
          foreach ($name in @('CalendarDomainHarness','WatcherLifetimeHarness','FenceVisibilityHarness')) {
            dotnet run --project "tests/$name/$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Domain harness failed: $name" }
          }
      - name: Package signed stable ZIP and verify actual Windows installation
        shell: pwsh
        run: |
          $key=Join-Path $env:RUNNER_TEMP ('stable-sign-'+[Guid]::NewGuid().ToString('N')+'.pem')
          $oauth='json/client_secret.json'
          try {
            [IO.File]::WriteAllText($key,$env:CYANDECK_UPDATE_SIGNING_KEY_PEM,[Text.UTF8Encoding]::new($false))
            New-Item -ItemType Directory json -Force | Out-Null
            [IO.File]::WriteAllText($oauth,$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON,[Text.UTF8Encoding]::new($false))
            ./package.ps1 -Runtime '${{ matrix.runtime }}' -SigningKeyPath $key
            if (-not $?) { throw 'Package generation failed' }
            ./verify-release.ps1 -ManifestPath "dist/CyanDeck-8.0.2-${{ matrix.runtime }}.update.json"
            if (-not $?) { throw 'Manifest signing failed' }
            ./tools/test_cyandeck_release_package.ps1 -Runtime '${{ matrix.runtime }}' -RequireOAuth
            if (-not $?) { throw 'Actual package install and uninstall failed' }
          } finally {
            if (Test-Path $oauth) { Remove-Item -LiteralPath $oauth -Force }
            if (Test-Path $key) { Remove-Item -LiteralPath $key -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-stable-${{ matrix.runtime }}
          path: |
            dist/CyanDeck-8.0.2-*.zip
            dist/CyanDeck-8.0.2-*.update.json
          if-no-files-found: error
  publish:
    needs: sign
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v8.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-stable-*
          path: release-assets
          merge-multiple: true
      - name: Publish explicitly approved stable release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This tag already exists. Refusing to overwrite."; exit 1
          fi
          # Never tag a newer commit that was not the source of these packages.
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          test "$main_sha" = "$GITHUB_SHA" || { echo "::error::main advanced during release packaging"; exit 1; }
          test "$(find release-assets -name '*.update.json' | wc -l)" -eq 2
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 2
          git archive --format=zip --output "release-assets/CyanDeck-${TAG}-full-source.zip" "$GITHUB_SHA"
          (cd release-assets && sha256sum -- *.zip > SHA256SUMS.txt)
          cat > stable-notes.md <<'NOTES'
          ## CyanDeck v8.0.2 — Stable
          - Environment Settings → Updates: opt into the **Beta update channel** to receive published beta releases alongside stable updates.
          - **Check and install updates…** applies the channel selection, checks the latest release, validates the RSA-PSS signed manifest and SHA-256 package hash, and installs after confirmation.
          - Stable is the default. Beta is strictly opt-in; drafts are never distributed. Automatic installation still requires the separate existing auto-install setting.
          - Repair of desktop group windows when Explorer obscures the desktop band, with multi-probe confirmation and rate-limited retries.
          - Windows x64 and ARM64 packages with Google Desktop OAuth configuration, sandboxed actual ZIP install/uninstall tests.
          - Original application icon and CyanDeck user data preserved; no DesktopDeck profile migration.

          **Download** win-x64 for Intel/AMD Windows or win-arm64 for Windows ARM. Extract and run CyanDeck.exe or use install.ps1.

          Note: interactive Explorer transitions and Google login require testing on a real Windows desktop; CI tests cannot simulate all GUI and consent flows.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "CyanDeck v8.0.2" --latest --notes-file stable-notes.md \
            release-assets/*.zip release-assets/*.update.json release-assets/SHA256SUMS.txt
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')" = true
