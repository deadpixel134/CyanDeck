name: Windows build and safety tests
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static safety regression checks
        shell: pwsh
        run: |
          python tools/run_v43_safety_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Static safety regression suite failed; build blocked.' }
          python tools/test_v45_recycle_bin_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Recycle-bin safety suite failed; build blocked.' }
      - name: CyanDeck migration PowerShell smoke tests
        shell: pwsh
        run: ./tools/test_cyandeck_migration_smoke.ps1
      - name: CyanDeck migration Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./tools/test_cyandeck_migration_smoke.ps1
      - name: CyanDeck installer/updater cutover guards (PowerShell 7)
        shell: pwsh
        run: ./tools/test_cyandeck_install_update_guards.ps1
      - name: CyanDeck installer/updater cutover guards (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/test_cyandeck_install_update_guards.ps1
      - name: CyanDeck update ZIP handoff and rollback (PowerShell 7)
        shell: pwsh
        run: ./tools/test_cyandeck_update_package_layout.ps1
      - name: CyanDeck update ZIP handoff and rollback (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/test_cyandeck_update_package_layout.ps1
      - name: WPF build for ${{ matrix.runtime }}
        run: dotnet build src/DesktopDeck/DesktopDeck.csproj --configuration Release --runtime ${{ matrix.runtime }}
      - name: CyanDeck launcher policy test
        run: dotnet run --project tests/CyanDeckLauncherHarness/CyanDeckLauncherHarness.csproj --configuration Release
      - name: CyanDeck executable handoff integration (Windows x64)
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./tools/test_cyandeck_launcher_preview.ps1
      - name: Build CyanDeck portable compatibility preview for ${{ matrix.runtime }}
        shell: pwsh
        run: ./tools/build-cyandeck-portable-preview.ps1 -Runtime '${{ matrix.runtime }}' -OutputDirectory "${{ runner.temp }}/cyandeck-portable/${{ matrix.runtime }}"
      - name: Verify CyanDeck portable preview contents and versions
        shell: pwsh
        run: ./tools/test_cyandeck_portable_preview.ps1 -BundleDirectory "${{ runner.temp }}/cyandeck-portable/${{ matrix.runtime }}"
      - name: Upload unsigned portable preview for isolated manual testing
        uses: actions/upload-artifact@v4
        with:
          name: cyandeck-portable-preview-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/cyandeck-portable/${{ matrix.runtime }}/CyanDeck.exe
            ${{ runner.temp }}/cyandeck-portable/${{ matrix.runtime }}/DesktopDeck.exe
            ${{ runner.temp }}/cyandeck-portable/${{ matrix.runtime }}/PREVIEW-README.txt
          if-no-files-found: error
          retention-days: 7
      - name: Calendar domain tests
        run: dotnet run --project tests/CalendarDomainHarness/CalendarDomainHarness.csproj --configuration Release
      - name: Watcher lifetime tests
        run: dotnet run --project tests/WatcherLifetimeHarness/WatcherLifetimeHarness.csproj --configuration Release
      - name: Fence visibility tests
        run: dotnet run --project tests/FenceVisibilityHarness/FenceVisibilityHarness.csproj --configuration Release
