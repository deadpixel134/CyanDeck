name: CyanDeck Windows build and safety tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CyanDeck source safety regressions
        shell: pwsh
        run: |
          python tools/run_v43_safety_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Source regression tests failed.' }
          python tools/test_v45_recycle_bin_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Recycle safety test failed.' }
      - name: Validate installer and updater PowerShell syntax
        shell: powershell
        run: |
          foreach ($file in @('install.ps1','uninstall.ps1','apply-update.ps1','package.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "Syntax error in $file" }
          }
      - name: Standalone CyanDeck identity test
        shell: pwsh
        run: python tools/test_cyandeck_identity.py
      - name: Clean install and uninstall in disposable Windows profile
        shell: pwsh
        run: ./tools/test_cyandeck_clean_install.ps1
      - name: Signed-style update layout and rollback integration
        shell: pwsh
        run: ./tools/test_cyandeck_update_package_layout.ps1
      - name: Windows PowerShell update rollback compatibility
        shell: powershell
        run: ./tools/test_cyandeck_update_package_layout.ps1
      - name: Build CyanDeck WPF for ${{ matrix.runtime }}
        shell: pwsh
        run: |
          dotnet build src/CyanDeck/CyanDeck.csproj -c Release -r '${{ matrix.runtime }}'
          if ($LASTEXITCODE -ne 0) { throw 'WPF build failed.' }
      - name: Calendar, watcher and fence domain tests
        shell: pwsh
        run: |
          dotnet run --project tests/CalendarDomainHarness/CalendarDomainHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Calendar test failed.' }
          dotnet run --project tests/WatcherLifetimeHarness/WatcherLifetimeHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Watcher test failed.' }
          dotnet run --project tests/FenceVisibilityHarness/FenceVisibilityHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fence test failed.' }
      - name: Publish CyanDeck application
        shell: pwsh
        run: |
          dotnet publish src/CyanDeck/CyanDeck.csproj -c Release -r '${{ matrix.runtime }}' --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "${{ runner.temp }}/CyanDeck/${{ matrix.runtime }}"
          if ($LASTEXITCODE -ne 0) { throw 'CyanDeck publish failed.' }
          if (-not (Test-Path "${{ runner.temp }}/CyanDeck/${{ matrix.runtime }}/CyanDeck.exe")) { throw 'CyanDeck.exe missing.' }
      - name: Verify signed CyanDeck package with disposable RSA key
        shell: pwsh
        run: |
          $keyFile=Join-Path $env:RUNNER_TEMP ('cyandeck-test-key-'+[Guid]::NewGuid().ToString('N')+'.pem')
          $rsa=[Security.Cryptography.RSA]::Create(2048)
          try {
            [IO.File]::WriteAllText($keyFile,$rsa.ExportPkcs8PrivateKeyPem(),[Text.UTF8Encoding]::new($false))
          } finally { $rsa.Dispose() }
          try {
            ./package.ps1 -Runtime '${{ matrix.runtime }}' -SigningKeyPath $keyFile
            $version=([xml](Get-Content src/CyanDeck/CyanDeck.csproj -Raw)).Project.PropertyGroup.Version
            ./verify-release.ps1 -ManifestPath "dist/CyanDeck-$version-${{ matrix.runtime }}.update.json"
            ./tools/test_cyandeck_release_package.ps1 -Runtime '${{ matrix.runtime }}'

          } finally {
            if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cyandeck-unprovisioned-${{ matrix.runtime }}
          path: ${{ runner.temp }}/CyanDeck/${{ matrix.runtime }}/CyanDeck.exe
          if-no-files-found: error
          retention-days: 7
