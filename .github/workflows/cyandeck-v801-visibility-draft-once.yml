name: CyanDeck 8.0.1 signed visibility-fix draft
on:
  push:
    branches: [main]
    paths: ['tools/v801-visibility-draft.trigger']
permissions:
  contents: write
jobs:
  sign:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      CYANDECK_UPDATE_SIGNING_KEY_PEM: ${{ secrets.CYANDECK_UPDATE_SIGNING_KEY_PEM || secrets.DESKTOPDECK_UPDATE_SIGNING_KEY_PEM }}
      CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON: ${{ secrets.CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON || secrets.DESKTOPDECK_GOOGLE_DESKTOP_OAUTH_JSON }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact candidate version and secrets
        shell: pwsh
        run: |
          [xml]$p=Get-Content src/CyanDeck/CyanDeck.csproj -Raw
          if ([string]$p.Project.PropertyGroup.Version -cne '8.0.1') { throw 'Expected CyanDeck 8.0.1.' }
          if ([string]::IsNullOrWhiteSpace($env:CYANDECK_UPDATE_SIGNING_KEY_PEM) -or [string]::IsNullOrWhiteSpace($env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON)) {
            throw 'Production update signing key or Desktop OAuth credentials are unavailable.'
          }
          $oauth=$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON | ConvertFrom-Json
          if (-not $oauth.installed.client_id -or -not $oauth.installed.client_secret) { throw 'Invalid Desktop OAuth JSON.' }
      - name: Run source, installer and domain safety tests
        shell: pwsh
        run: |
          python tools/run_v43_safety_regressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Source regression failed.' }
          python tools/test_v45_recycle_bin_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Recycle safety regression failed.' }
          python tools/test_cyandeck_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'CyanDeck identity regression failed.' }
          dotnet run --project tests/FenceVisibilityHarness/FenceVisibilityHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fence/ShowDesktop recovery policy regression failed.' }
          dotnet run --project tests/CalendarDomainHarness/CalendarDomainHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Calendar tests failed.' }
          dotnet run --project tests/WatcherLifetimeHarness/WatcherLifetimeHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Watcher tests failed.' }
      - name: Produce and smoke-test signed OAuth-provisioned package
        shell: pwsh
        run: |
          $privateKey=Join-Path $env:RUNNER_TEMP ('cyandeck-v801-sign-'+[Guid]::NewGuid().ToString('N')+'.pem')
          $desktopOAuth='json/client_secret.json'
          try {
            [IO.File]::WriteAllText($privateKey,$env:CYANDECK_UPDATE_SIGNING_KEY_PEM,[Text.UTF8Encoding]::new($false))
            New-Item -ItemType Directory -Path json -Force | Out-Null
            [IO.File]::WriteAllText($desktopOAuth,$env:CYANDECK_GOOGLE_DESKTOP_OAUTH_JSON,[Text.UTF8Encoding]::new($false))
            ./package.ps1 -Runtime '${{ matrix.runtime }}' -SigningKeyPath $privateKey
            if (-not $?) { throw 'Package generation failed.' }
            ./verify-release.ps1 -ManifestPath "dist/CyanDeck-8.0.1-${{ matrix.runtime }}.update.json"
            if (-not $?) { throw 'Signature verification failed.' }
            ./tools/test_cyandeck_release_package.ps1 -Runtime '${{ matrix.runtime }}' -RequireOAuth
            if (-not $?) { throw 'Signed installer and uninstall smoke test failed.' }
          } finally {
            if (Test-Path -LiteralPath $desktopOAuth) { Remove-Item -LiteralPath $desktopOAuth -Force }
            if (Test-Path -LiteralPath $privateKey) { Remove-Item -LiteralPath $privateKey -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-v801-${{ matrix.runtime }}
          path: |
            dist/CyanDeck-8.0.1-*.zip
            dist/CyanDeck-8.0.1-*.update.json
          if-no-files-found: error
  private-draft:
    needs: sign
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v8.0.1
      SOURCE_SHA: 9386b946160cb7c07cfd0fb2ef962217897a2cdd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-v801-*
          path: release-assets
          merge-multiple: true
      - name: Assemble immutable source and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 2
          test "$(find release-assets -name '*.update.json' | wc -l)" -eq 2
          git archive --format=zip --output "release-assets/CyanDeck-${TAG}-full-source.zip" "$SOURCE_SHA"
          (cd release-assets && sha256sum -- *.zip > SHA256SUMS.txt)
      - name: Save v8.0.1 as private draft, never publish automatically
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v8.0.1 already exists. Refuse to overwrite any release."; exit 1
          fi
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" --title "CyanDeck v8.0.1 - desktop group visibility fix (test candidate)" \
            --notes "Test candidate only; not publicly released. Improves persistent Explorer desktop Z-order displacement recovery with 30-second backoff and multi-probe confirmation. Does not migrate or delete DesktopDeck user data. Real Windows x64/ARM64 package install-uninstall and signed manifest checks passed. Please test group visibility with virtual desktops, Win+D and multi-monitor before approving production publication." \
            release-assets/*.zip release-assets/*.update.json release-assets/SHA256SUMS.txt
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"
